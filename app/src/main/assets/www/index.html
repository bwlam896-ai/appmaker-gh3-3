<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حافظة الفواتير الذكية — معاينة</title>
<style>
  * { box-sizing: border-box; font-family: -apple-system, "Segoe UI", Tahoma, sans-serif; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1a3a30, #0d1f19); padding: 16px;
  }
  .phone {
    width: 400px; max-width: 100%; height: 780px; max-height: 95vh;
    background: #F3F7F2; border-radius: 32px; overflow: hidden; position: relative;
    box-shadow: 0 24px 60px rgba(0,0,0,.5); display: flex; flex-direction: column;
  }
  header {
    background: #116B4F; color: #fff; padding: 16px 20px 20px;
  }
  header h1 { margin: 0 0 12px; font-size: 18px; font-weight: 600; }
  header .label { font-size: 12px; opacity: .9; }
  header .total { font-size: 28px; font-weight: 700; margin-top: 4px; }
  header .count { font-size: 12px; opacity: .85; margin-top: 4px; }
  .filters {
    background: #116B4F; padding: 0 12px 12px; display: flex; gap: 8px; overflow-x: auto;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.35);
    padding: 6px 14px; border-radius: 100px; font-size: 12px; cursor: pointer; white-space: nowrap;
    transition: .15s;
  }
  .chip.active { background: #A3F2D0; color: #002115; border-color: #A3F2D0; font-weight: 600; }
  .list { flex: 1; overflow-y: auto; padding: 8px 12px 96px; }
  .bill-card {
    background: #fff; border-radius: 16px; padding: 12px; display: flex; gap: 12px;
    margin-bottom: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); cursor: pointer;
    transition: transform .1s, box-shadow .15s;
  }
  .bill-card:hover { box-shadow: 0 3px 10px rgba(0,0,0,.14); }
  .bill-card:active { transform: scale(.985); }
  .bill-thumb {
    width: 88px; height: 88px; border-radius: 12px; flex-shrink: 0;
    background: #DCE5DD center/cover no-repeat; display: flex; align-items: center;
    justify-content: center; color: #707973; font-size: 32px; overflow: hidden;
  }
  .bill-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .bill-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .bill-store { font-weight: 600; font-size: 15px; color: #191C1A; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .bill-amount { font-size: 18px; font-weight: 700; color: #116B4F; margin-top: 4px; }
  .bill-date { font-size: 11px; color: #707973; margin-top: 2px; }
  .badge {
    margin-top: auto; align-self: flex-start; font-size: 11px; font-weight: 600;
    color: #fff; padding: 3px 12px; border-radius: 100px;
  }
  .empty {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 32px; color: #707973;
  }
  .empty .icon { font-size: 72px; opacity: .5; margin-bottom: 12px; }
  .empty h3 { color: #191C1A; margin: 8px 0; }
  .empty p { margin: 4px 0; font-size: 14px; }
  .fab {
    position: absolute; bottom: 20px; left: 20px; width: 60px; height: 60px;
    border-radius: 50%; background: #116B4F; color: #fff; border: none; font-size: 30px;
    cursor: pointer; box-shadow: 0 6px 16px rgba(0,0,0,.3); transition: .2s;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .fab:hover { background: #0d5540; transform: scale(1.05); }
  .overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,.5);
    display: none; align-items: flex-end; z-index: 10; animation: fadeIn .2s;
  }
  .overlay.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .sheet {
    background: #F3F7F2; width: 100%; border-radius: 24px 24px 0 0; padding: 20px;
    max-height: 92%; overflow-y: auto; animation: slideUp .25s;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet h2 { margin: 0 0 14px; font-size: 18px; color: #191C1A; }
  .img-preview {
    width: 100%; height: 160px; border-radius: 12px; background: #DCE5DD;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    color: #707973; font-size: 14px; margin-bottom: 12px; position: relative;
  }
  .img-preview img { width: 100%; height: 100%; object-fit: contain; }
  .img-actions { display: flex; gap: 8px; margin-bottom: 12px; }
  .img-actions button {
    flex: 1; padding: 10px; border-radius: 100px; border: 1px solid #707973;
    background: transparent; color: #116B4F; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .img-actions button:hover { background: rgba(17,107,79,.08); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: #707973; margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 12px 14px; border: 1px solid #707973; border-radius: 10px;
    font-size: 14px; background: transparent; color: #191C1A; outline: none;
  }
  .field input:focus { border-color: #116B4F; border-width: 2px; padding: 11px 13px; }
  .cats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .cat {
    padding: 8px 16px; border-radius: 100px; border: 1px solid #707973;
    background: transparent; color: #191C1A; font-size: 13px; cursor: pointer;
  }
  .cat.active { background: #116B4F; color: #fff; border-color: #116B4F; font-weight: 600; }
  .save-btn {
    width: 100%; padding: 14px; border-radius: 100px; border: none;
    background: #116B4F; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .save-btn:hover { background: #0d5540; }
  .detail-sheet .detail-img {
    width: 100%; height: 200px; background: #DCE5DD; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    margin-bottom: 14px; color: #707973;
  }
  .detail-sheet .detail-img img { width: 100%; height: 100%; object-fit: contain; }
  .detail-store { font-size: 18px; font-weight: 600; color: #191C1A; margin-bottom: 6px; }
  .detail-amount { font-size: 26px; font-weight: 700; color: #116B4F; margin-bottom: 6px; }
  .detail-meta { font-size: 13px; color: #707973; margin-bottom: 4px; }
  .detail-actions { display: flex; gap: 8px; margin-top: 18px; }
  .detail-actions button {
    flex: 1; padding: 12px; border-radius: 100px; font-size: 14px; font-weight: 600;
    cursor: pointer; border: 1px solid #707973; background: transparent; color: #191C1A;
  }
  .detail-actions .danger { background: #D32F2F; color: #fff; border-color: #D32F2F; }
  .toast {
    position: absolute; bottom: 100px; right: 50%; transform: translateX(50%);
    background: rgba(0,0,0,.8); color: #fff; padding: 10px 20px; border-radius: 100px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 50;
  }
  .toast.show { opacity: 1; }
  .hidden-input { display: none; }
</style>
</head>
<body>
<div class="phone">
  <header>
    <h1>حافظة الفواتير الذكية</h1>
    <div class="label">إجمالي المبالغ المسجلة</div>
    <div class="total" id="total">0.00 ر.س</div>
    <div class="count" id="count">0 فاتورة</div>
  </header>
  <div class="filters" id="filters">
    <button class="chip active" data-cat="all">جميع الفواتير</button>
    <button class="chip" data-cat="food">طعام</button>
    <button class="chip" data-cat="shopping">تسوق</button>
    <button class="chip" data-cat="home">منزلية</button>
    <button class="chip" data-cat="other">أخرى</button>
  </div>
  <div class="list" id="list"></div>
  <div class="empty" id="empty" style="display:none">
    <div class="icon">🧾</div>
    <h3>لا توجد فواتير</h3>
    <p>اضغط على زر الإضافة لتوثيق أول فاتورة لك</p>
  </div>
  <button class="fab" id="fab" aria-label="إضافة فاتورة">+</button>

  <div class="overlay" id="addOverlay">
    <div class="sheet">
      <h2>فاتورة جديدة</h2>
      <div class="img-preview" id="imgPreview">لم يتم اختيار صورة</div>
      <div class="img-actions">
        <button id="btnCamera">📷 الكاميرا</button>
        <button id="btnGallery">🖼️ المعرض</button>
      </div>
      <input type="file" accept="image/*" capture="environment" class="hidden-input" id="cameraInput">
      <input type="file" accept="image/*" class="hidden-input" id="galleryInput">
      <div class="field">
        <label>اسم المتجر</label>
        <input type="text" id="storeInput" placeholder="مثال: سوبر ماركت">
      </div>
      <div class="field">
        <label>المبلغ</label>
        <input type="number" step="0.01" id="amountInput" placeholder="0.00">
      </div>
      <div class="field">
        <label>التصنيف</label>
        <div class="cats" id="cats">
          <button class="cat active" data-cat="food">طعام</button>
          <button class="cat" data-cat="shopping">تسوق</button>
          <button class="cat" data-cat="home">منزلية</button>
          <button class="cat" data-cat="other">أخرى</button>
        </div>
      </div>
      <button class="save-btn" id="saveBtn">حفظ الفاتورة</button>
    </div>
  </div>

  <div class="overlay" id="detailOverlay">
    <div class="sheet detail-sheet">
      <h2>تفاصيل الفاتورة</h2>
      <div class="detail-img" id="detailImg"></div>
      <div class="detail-store" id="detailStore"></div>
      <div class="detail-amount" id="detailAmount"></div>
      <div class="detail-meta" id="detailDate"></div>
      <div class="detail-meta" id="detailCat"></div>
      <div class="detail-actions">
        <button id="closeDetail">إغلاق</button>
        <button class="danger" id="deleteBtn">حذف</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function() {
  const CATEGORIES = {
    food: { label: "طعام", color: "#D32F2F" },
    shopping: { label: "تسوق", color: "#1976D2" },
    home: { label: "منزلية", color: "#F57C00" },
    other: { label: "أخرى", color: "#616161" }
  };
  const STORAGE_KEY = "quickbill_bills";
  let bills = loadBills();
  let filter = "all";
  let pendingImage = null;
  let selectedCategory = "food";
  let currentDetailId = null;

  const listEl = document.getElementById("list");
  const emptyEl = document.getElementById("empty");
  const totalEl = document.getElementById("total");
  const countEl = document.getElementById("count");
  const filtersEl = document.getElementById("filters");
  const addOverlay = document.getElementById("addOverlay");
  const detailOverlay = document.getElementById("detailOverlay");
  const toastEl = document.getElementById("toast");
  const imgPreview = document.getElementById("imgPreview");
  const cameraInput = document.getElementById("cameraInput");
  const galleryInput = document.getElementById("galleryInput");
  const storeInput = document.getElementById("storeInput");
  const amountInput = document.getElementById("amountInput");

  function loadBills() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
    catch (e) { return []; }
  }
  function saveBills() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(bills));
  }
  function formatAmount(v) { return Number(v).toFixed(2) + " ر.س"; }
  function formatDate(ts) {
    const d = new Date(ts);
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const dd = String(d.getDate()).padStart(2, "0");
    return yyyy + "/" + mm + "/" + dd;
  }
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove("show"), 2000);
  }

  function render() {
    const totalAll = bills.reduce((s, b) => s + Number(b.amount || 0), 0);
    totalEl.textContent = formatAmount(totalAll);
    countEl.textContent = bills.length + " فاتورة";

    const filtered = filter === "all"
      ? bills.slice().sort((a, b) => b.createdAt - a.createdAt)
      : bills.filter(b => b.category === filter).sort((a, b) => b.createdAt - a.createdAt);

    if (filtered.length === 0) {
      listEl.innerHTML = "";
      listEl.style.display = "none";
      emptyEl.style.display = "flex";
      return;
    }
    listEl.style.display = "block";
    emptyEl.style.display = "none";

    listEl.innerHTML = filtered.map(b => {
      const cat = CATEGORIES[b.category] || CATEGORIES.other;
      const thumb = b.image
        ? `<img src="${b.image}" alt="صورة الفاتورة">`
        : "🧾";
      return `
        <div class="bill-card" data-id="${b.id}">
          <div class="bill-thumb">${thumb}</div>
          <div class="bill-info">
            <div class="bill-store">${escapeHtml(b.store)}</div>
            <div class="bill-amount">${formatAmount(b.amount)}</div>
            <div class="bill-date">${formatDate(b.createdAt)}</div>
            <div class="badge" style="background:${cat.color}">${cat.label}</div>
          </div>
        </div>`;
    }).join("");

    listEl.querySelectorAll(".bill-card").forEach(card => {
      card.addEventListener("click", () => openDetail(card.dataset.id));
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }

  filtersEl.addEventListener("click", e => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    filtersEl.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    btn.classList.add("active");
    filter = btn.dataset.cat;
    render();
  });

  document.getElementById("cats").addEventListener("click", e => {
    const btn = e.target.closest(".cat");
    if (!btn) return;
    document.querySelectorAll("#cats .cat").forEach(c => c.classList.remove("active"));
    btn.classList.add("active");
    selectedCategory = btn.dataset.cat;
  });

  document.getElementById("fab").addEventListener("click", () => {
    pendingImage = null;
    selectedCategory = "food";
    storeInput.value = "";
    amountInput.value = "";
    imgPreview.textContent = "لم يتم اختيار صورة";
    imgPreview.innerHTML = "لم يتم اختيار صورة";
    document.querySelectorAll("#cats .cat").forEach((c, i) => {
      c.classList.toggle("active", i === 0);
    });
    addOverlay.classList.add("show");
  });

  function closeAdd() { addOverlay.classList.remove("show"); }

  document.getElementById("btnCamera").addEventListener("click", () => cameraInput.click());
  document.getElementById("btnGallery").addEventListener("click", () => galleryInput.click());

  function handleFile(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      pendingImage = e.target.result;
      imgPreview.innerHTML = `<img src="${pendingImage}" alt="معاينة">`;
    };
    reader.readAsDataURL(file);
    input.value = "";
  }
  cameraInput.addEventListener("change", () => handleFile(cameraInput));
  galleryInput.addEventListener("change", () => handleFile(galleryInput));

  document.getElementById("saveBtn").addEventListener("click", () => {
    const store = storeInput.value.trim();
    const amount = parseFloat(amountInput.value);
    if (!store) { showToast("أدخل اسم المتجر"); return; }
    if (!amount || amount <= 0) { showToast("أدخل مبلغًا صحيحًا"); return; }

    bills.push({
      id: "b_" + Date.now() + "_" + Math.floor(Math.random() * 1000),
      store,
      amount,
      category: selectedCategory,
      image: pendingImage,
      createdAt: Date.now()
    });
    saveBills();
    closeAdd();
    render();
    showToast("تم حفظ الفاتورة");
  });

  function openDetail(id) {
    const bill = bills.find(b => b.id === id);
    if (!bill) return;
    currentDetailId = id;
    const cat = CATEGORIES[bill.category] || CATEGORIES.other;
    const imgEl = document.getElementById("detailImg");
    if (bill.image) {
      imgEl.innerHTML = `<img src="${bill.image}" alt="فاتورة">`;
    } else {
      imgEl.textContent = "🧾";
    }
    document.getElementById("detailStore").textContent = bill.store;
    document.getElementById("detailAmount").textContent = formatAmount(bill.amount);
    document.getElementById("detailDate").textContent = formatDate(bill.createdAt);
    document.getElementById("detailCat").textContent = "التصنيف: " + cat.label;
    detailOverlay.classList.add("show");
  }

  document.getElementById("closeDetail").addEventListener("click", () => {
    detailOverlay.classList.remove("show");
  });

  document.getElementById("deleteBtn").addEventListener("click", () => {
    if (!currentDetailId) return;
    if (!confirm("هل تريد حذف هذه الفاتورة؟")) return;
    bills = bills.filter(b => b.id !== currentDetailId);
    saveBills();
    currentDetailId = null;
    detailOverlay.classList.remove("show");
    render();
    showToast("تم حذف الفاتورة");
  });

  addOverlay.addEventListener("click", e => {
    if (e.target === addOverlay) closeAdd();
  });
  detailOverlay.addEventListener("click", e => {
    if (e.target === detailOverlay) detailOverlay.classList.remove("show");
  });

  render();
})();
</script>
</body>
</html>
